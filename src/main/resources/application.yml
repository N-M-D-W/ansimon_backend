spring:
  application:
    name: ansimon-backend
  profiles:
    active: local
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/ansimon?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${MYSQL_USERNAME:ansimon}
    password: ${MYSQL_PASSWORD:ansimon}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul
  flyway:
    enabled: true
    locations: classpath:db/migration/mysql
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
    vectorstore:
      type: ${SPRING_AI_VECTORSTORE_TYPE:none}
      pgvector:
        initialize-schema: false
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

ansimon:
  external:
    kma:
      base-url: ${KMA_BASE_URL:https://apis.data.go.kr}
      api-key: ${KMA_API_KEY:}
    shelter:
      base-url: ${SHELTER_BASE_URL:https://apis.data.go.kr}
      api-key: ${SHELTER_API_KEY:}
    tmap:
      base-url: ${TMAP_BASE_URL:https://apis.openapi.sk.com}
      api-key: ${TMAP_API_KEY:}
    ml:
      base-url: ${ML_API_BASE_URL:http://localhost:8000}
    phone:
      base-url: ${PHONE_API_BASE_URL:http://localhost:9000}

